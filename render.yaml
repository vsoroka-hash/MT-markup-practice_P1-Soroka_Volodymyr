services:
  - type: web
    runtime: node
    name: flora-backend-soroka
    repo: https://github.com/vsoroka-hash/MT-markup-practice_P1-Soroka_Volodymyr.git
    branch: main
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api-docs
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DB_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: Flora
          property: connectionString
